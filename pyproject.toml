# mlsupplychain — security & compliance scanner for ML pipelines.
#
# Install (pure-Python, works everywhere):
#   pip install mlsupplychain
#
# With native acceleration (optional; wheels for Linux/macOS/Windows ship
# the compiled module, sdist build requires a Rust toolchain):
#   pip install 'mlsupplychain[native]'
#
# For development:
#   pip install -e '.[dev]'

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsupplychain"
version = "0.1.0"
description = "Security and compliance scanner for ML pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "ML Guard contributors" },
]
keywords = [
    "ml", "security", "pickle", "safetensors", "onnx",
    "sbom", "cyclonedx", "compliance", "eu-ai-act",
    "vulnerability", "cve", "osv", "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Minimal dependency footprint. Every dependency is a potential supply
# chain CVE — which is exactly what this tool scans for. We deliberately
# don't ship:
#   • requests — no network calls on the default code path; the OSV DB
#     is downloaded by the user via `cve-update`. Live mode is gated
#     behind the [live] extra.
#   • rich    — text output uses raw ANSI escapes (see output/text.py).
#   • onnx    — bundled in-tree protobuf parser (_protobuf.py). Pulling
#     the real `onnx` lib would mean the scanner's parser shares a CVE
#     surface with the format it scans — a bad pattern.
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "packaging>=21.0",      # PEP 440 version comparison for the CVE matcher
]

[project.optional-dependencies]
# Native acceleration via the Rust engine (published wheels include the
# compiled module; sdist install requires a Rust toolchain).
native = [
    "mlsupplychain-engine>=0.1; platform_system != 'Emscripten'",
]

# Development
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "build>=1.0",
    "twine>=4.0",
]

# Opt-in live OSV API access, for users who prefer always-fresh data over
# the bundled / cve-update flow. Not the default: production runs use the
# offline DB.
live = [
    "requests>=2.31",
]

[project.urls]
Homepage      = "https://github.com/ml-guard/ml-guard"
Documentation = "https://github.com/ml-guard/ml-guard#readme"
Repository    = "https://github.com/ml-guard/ml-guard"
Issues        = "https://github.com/ml-guard/ml-guard/issues"
Changelog     = "https://github.com/ml-guard/ml-guard/blob/main/CHANGELOG.md"

[project.scripts]
ml-guard = "ml_guard.cli:main"

# ----------------------------------------------------------------------------
# Build
# ----------------------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["ml_guard*"]
exclude = ["tests*", "benchmarks*"]

# Bundled mini OSV DB + template files ship in the wheel.
# Full PyPI OSV coverage is downloaded by the user via `ml-guard cve-update`.
[tool.setuptools.package-data]
ml_guard = [
    "data/osv-mini.sqlite",
    "data/README.md",
    "py.typed",
]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests that take more than 1 second",
    "integration: tests requiring real OSV dump (skipped if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
]
ignore = [
    "E501",   # line too long — we use 100 as a soft limit
    "B008",   # function calls in defaults (needed for click)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"benchmarks/*" = ["B007"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# Third-party packages without stubs — ignored; our own code is typed.
[[tool.mypy.overrides]]
module = ["yaml", "packaging.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ml_guard"]
omit = ["*/tests/*", "*/benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
