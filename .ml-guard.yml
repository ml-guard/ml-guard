# ml-guard self-scan configuration for CI.
#
# This repo holds test fixtures for the scanners — intentionally malicious
# pickles, .env files with example secrets, requirements.txt with vulnerable
# packages for the CVE check. Without exclusions, ml-guard would correctly
# detect them all and fail CI with exit code 1.
#
# This file tells ml-guard "I know these are test data, don't flag them".

exclude:
  # Test fixtures — malicious by design
  - 'tests/fixtures/**'
  - 'tests/**'
  # The stdlib test runner has inline fixtures (fake secrets, malicious
  # pickle bytes) that must not be flagged either
  - 'run_tests.py'
  # Maintainer scripts contain package names that appear in OSV as
  # malicious — they're deliberate, used by matcher tests
  - 'scripts/popular-ml-packages.txt'
  # Docs may contain example secret strings
  - 'docs/**'
  # Benchmarks can generate test pickles
  - 'benchmarks/**'
  # The Rust engine itself isn't subject to security scanning
  - 'rust_engine/target/**'

# Minimum severity that flips CI to fail.
# critical only = real RCE / leaked production credential.
fail_on: critical
