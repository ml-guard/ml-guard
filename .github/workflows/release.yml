# Release ML Guard wheels and sdist to PyPI on git tag.
#
# This workflow:
#   1. Builds the bundled mini OSV DB (so it ships with each release)
#   2. Builds a sdist + cross-platform wheels via cibuildwheel
#   3. Publishes everything to PyPI via OpenID Connect (no API token)
#   4. Creates a GitHub Release with the artifacts attached
#
# Setup needed in PyPI (one-time, by a maintainer):
#   • Add a Trusted Publisher under your project page on pypi.org.
#     Owner: ml-guard, Repository: ml-guard,
#     Workflow filename: release.yml, Environment name: pypi.
#   • Same for test.pypi.org if you want preview releases via tag suffix.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read       # checkout
  id-token: write      # required for Trusted Publisher (OIDC)

jobs:

  # ------------------------------------------------------------------
  # 1. Build the bundled mini OSV DB
  # ------------------------------------------------------------------
  build-osv-mini:
    name: Build bundled OSV mini-DB
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Download OSV PyPI dump
        run: |
          curl -fL --retry 3 \
            -o /tmp/osv-pypi.zip \
            https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip

      - name: Install ml-guard for the build script
        run: pip install -e .

      - name: Build mini DB
        run: |
          python scripts/build_mini_osv.py \
            --source /tmp/osv-pypi.zip \
            --output ml_guard/data/osv-mini.sqlite

      - id: hash
        run: |
          sha=$(sha256sum ml_guard/data/osv-mini.sqlite | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Built mini-DB sha256=$sha, size=$(stat -c %s ml_guard/data/osv-mini.sqlite) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: osv-mini
          path: ml_guard/data/osv-mini.sqlite
          retention-days: 1

  # ------------------------------------------------------------------
  # 2. Build sdist
  # ------------------------------------------------------------------
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: [build-osv-mini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Pull bundled mini-DB
        uses: actions/download-artifact@v4
        with:
          name: osv-mini
          path: ml_guard/data/

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ------------------------------------------------------------------
  # 3. Build wheels for all platforms
  # ------------------------------------------------------------------
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: [build-osv-mini]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pure-Python wheel — works on every OS, every CPython 3.9+.
        # When/if we ship the native ml-guard-engine extension as part
        # of this same wheel, expand to:
        #   ubuntu-latest (manylinux x86_64+aarch64), macos-13,
        #   macos-14 (arm64), windows-latest.
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Pull bundled mini-DB
        uses: actions/download-artifact@v4
        with:
          name: osv-mini
          path: ml_guard/data/

      - name: Build pure-Python wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  # ------------------------------------------------------------------
  # 4. Publish to PyPI / TestPyPI
  # ------------------------------------------------------------------
  publish:
    name: Publish to ${{ inputs.target || 'pypi' }}
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      # Bound to the Trusted Publisher you configured on PyPI.
      name: ${{ inputs.target || 'pypi' }}
      url: https://pypi.org/p/mlsupplychain
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-staging

      - name: Flatten into dist/
        run: |
          mkdir -p dist
          find dist-staging -name '*.whl' -exec cp {} dist/ \;
          find dist-staging -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: inputs.target != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ------------------------------------------------------------------
  # 5. Attach to a GitHub Release
  # ------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v') && (inputs.target != 'testpypi')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-staging

      - name: Flatten into dist/
        run: |
          mkdir -p dist
          find dist-staging -name '*.whl' -exec cp {} dist/ \;
          find dist-staging -name '*.tar.gz' -exec cp {} dist/ \;

      - name: Compute SHA-256 sums
        run: |
          (cd dist && sha256sum *) > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
