# Build the native `ml_guard_engine` module via maturin.
# Built separately from the main ml_guard Python package:
#
#   pip install maturin
#   cd rust_engine && maturin develop --release
#
# After that, `import ml_guard_engine` works in the current venv and
# the pickle scanner automatically switches to the native path.

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "ml_guard_engine"
version = "0.1.0"
description = "Native engine for ML Guard scanners"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["pyo3/extension-module"]
strip = true
