[package]
name = "ml_guard_engine"
version = "0.1.0"
edition = "2021"
description = "Native engine for ML Guard scanners"
license = "Apache-2.0"

[lib]
name = "ml_guard_engine"
# cdylib — для Python-расширения, rlib — для unit-тестов в Rust
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
